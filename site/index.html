<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d17">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Compare Ollama model sizes and conservative local AI hardware compatibility estimates. A free, private, mobile-first model explorer.">
  <title>LocalAI Lab | Find your local fit.</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#explore" aria-label="LocalAI Lab home"><span class="brand-icon">◈</span><span class="brand-words">local<span>ai</span><small>THE MODEL LAB</small></span></a>
    <div class="side-caption">WORKSPACE</div>
    <nav class="side-links" id="sidebar-nav" aria-label="Main navigation"></nav>
    <div class="side-bottom"><span class="signal"></span><span><b>Device-local workspace</b><small>No account. No telemetry. No API key.</small></span></div>
    <a href="https://empyrios.github.io/apphub/" class="back-hub">↗ Return to AppHub</a>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-title"><span class="mobile-brand">◈</span><div><div class="eyebrow">LOCALAI / LABORATORY</div><div id="header-label">Model explorer</div></div></div>
      <div class="top-tools"><label class="search-field" for="model-search"><span aria-hidden="true">⌕</span><input id="model-search" type="search" autocomplete="off" placeholder="Search models…" aria-label="Search AI models"></label><span class="live-mark"><i></i> LOCAL FIRST</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>LocalAI Lab <b>v1.0</b></span><span>Illustrative fit estimates, not measured benchmarks.</span></footer>
  </div>
</div>
<nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation"></nav>
<dialog id="detail-dialog" aria-label="Model analysis"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
